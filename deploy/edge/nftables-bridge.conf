#!/usr/sbin/nft -f
# Bridge host. New inbound connections are dropped on every interface, including the VPN.
# This is not the kill switch. Outbound policy must also drop traffic that is not DHCP,
# the OVPN endpoint, or leaving through wg0. Otherwise a down tunnel leaks the house address.
table inet ecash_bridge {
	chain input {
		type filter hook input priority 0; policy drop;
		iif "lo" accept
		ct state established,related accept
	}
	chain forward {
		type filter hook forward priority 0; policy drop;
	}
}
