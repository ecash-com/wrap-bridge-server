# Optional locally managed tunnel. Do not use this for a new install.
# The installer uses CLOUDFLARE_TUNNEL_TOKEN from cloudflare.md instead.
tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /etc/ecash-bridge/cloudflared.json

ingress:
  - hostname: swap.example.com
    service: http://127.0.0.1:8080
  - service: http_status:404
