[package]
name = "swap-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bdk_electrum = { version = "0.24.0", default-features = false, features = ["use-openssl"] }
bdk_esplora = { version = "0.22.2", features = ["async-https", "tokio"] }
bdk_file_store = "0.22.0"
bdk_wallet = { version = "3.1.0", features = ["file_store", "keys-bip39"] }
bs58 = "0.5"
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
reqwest = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
solana-client = "2.3.13"
solana-sdk = "2.3.1"
solana-transaction-status-client-types = "2.3.13"
spl-associated-token-account = "4"
spl-token = "6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
toml = "1.1.4"
uuid = { version = "1.24.1", features = ["v4"] }
