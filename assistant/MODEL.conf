# release asset on this repository, and make-bundle.sh places it in bundle/model/. install.sh
# never downloads it; it only verifies the bytes below before installing them.
#
# Llama 3.2 3B Instruct, 4-bit (Q4_K_M) GGUF quantization by bartowski. 2,019,377,696 bytes.
MODEL_FILE="Llama-3.2-3B-Instruct-Q4_K_M.gguf"
