MODEL_SIZE="2019377696"
# Where make-bundle.sh fetches it when bundle/model/ is empty. Replace with this repository's
# release asset once uploaded; the hash above is what matters, not the host.
MODEL_URL="https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/main/Llama-3.2-3B-Instruct-Q4_K_M.gguf"
# llama.cpp release that make-bundle.sh builds llama-server from: the tag, and the commit it must
# resolve to. The commit is what is checked; GitHub's generated tarballs are not byte-stable.
LLAMA_CPP_TAG="b11935"
LLAMA_CPP_COMMIT="7ecb57f7adbea2928aa468ad2aecf05b10725ad4"
